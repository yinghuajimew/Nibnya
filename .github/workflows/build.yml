# .github/workflows/build.yml

name: Build Nibnya APK

on:
  push:
    branches:
      - main
      - ci-release
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (release=正式版 / debug=测试版 / both=全部)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > app/nibnya.keystore

      - name: Build APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug
          elif [ "${{ github.event.inputs.build_type }}" = "both" ]; then
            ./gradlew assembleDebug assembleRelease
          else
            ./gradlew assembleRelease
          fi

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Nibnya-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 60

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Nibnya-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
